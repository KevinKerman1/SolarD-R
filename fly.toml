app = "solardetachpro"
primary_region = "sjc"

[build]

[deploy]
  release_command = "node server/migrate.js"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  ALLOWED_ORIGIN = "https://solardetachpro.com,https://www.solardetachpro.com"
  MIN_RECAPTCHA_SCORE = "0.3"
  RATE_LIMIT_PER_MIN = "5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
